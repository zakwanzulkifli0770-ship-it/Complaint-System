kind = "web"
previewPath = "/"
title = "E-Aduan Smart Management System"
version = "1.0.0"
id = "artifacts/e-aduan"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20789

[services.development]
run = "pnpm --filter @workspace/e-aduan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/e-aduan", "run", "build" ]
publicDir = "artifacts/e-aduan/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20789"
BASE_PATH = "/"
