# render.yaml — Render deployment configuration for e-Aduan Smart Management System
#
# TWO services are deployed from this repository:
#   1. eaduan-api  — Node.js Web Service  (Express API at /api)
#   2. eaduan-web  — Static Site          (React + Vite frontend)
# Plus a managed PostgreSQL database.
#
# FIRST-TIME SETUP (do these steps after importing the repo into Render):
#   1. Let Render create both services and the database from this file.
#   2. Copy the live URL of eaduan-api  (e.g. https://eaduan-api.onrender.com)
#      → paste it into VITE_API_URL on the eaduan-web service, then redeploy.
#   3. Copy the live URL of eaduan-web  (e.g. https://eaduan-web.onrender.com)
#      → paste it into ALLOWED_ORIGINS on the eaduan-api service, then redeploy.
#
# If you attach a custom domain to either service, add it to the respective
# variable as well (comma-separated for ALLOWED_ORIGINS).

services:
  # ─── API Server (Node.js Web Service) ─────────────────────────────────────
  - type: web
    name: eaduan-api
    env: node
    region: singapore
    plan: free
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm run typecheck:libs &&
      pnpm --filter @workspace/api-server run build &&
      pnpm --filter @workspace/db run push-force
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: eaduan-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Replace with the actual frontend URL after the first deploy.
      # Separate multiple origins with commas.
      - key: ALLOWED_ORIGINS
        value: https://eaduan-web.onrender.com

  # ─── Frontend Static Site (React + Vite) ──────────────────────────────────
  - type: web
    name: eaduan-web
    env: static
    region: singapore
    plan: free
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm run typecheck:libs &&
      pnpm --filter @workspace/e-aduan run build
    staticPublishPath: ./artifacts/e-aduan/dist/public
    envVars:
      - key: NODE_ENV
        value: production
      # Replace with the actual API URL after the first deploy.
      # This value is baked into the JS bundle at build time.
      - key: VITE_API_URL
        value: https://eaduan-api.onrender.com
    routes:
      # Serve index.html for all paths so the React SPA router works correctly.
      - type: rewrite
        source: /*
        destination: /index.html

# ─── PostgreSQL Database ─────────────────────────────────────────────────────
databases:
  - name: eaduan-db
    databaseName: eaduan
    user: eaduan
    plan: free
    region: singapore
